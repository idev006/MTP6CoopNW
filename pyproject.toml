[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp6coopnw"
version = "0.1.0.dev0"
description = "Distributed Network and SQL Infrastructure Control System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "MTP6CoopNW Team"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: pure non-destructive unit tests",
  "contract: contract/schema tests",
  "scenario: fake-adapter scenario tests",
  "windows: Windows integration tests",
  "destructive: tests that may change operating-system state",
  "acceptance: acceptance tests"
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["mtp6coopnw"]
