slow_seconds = 60
reconcile_seconds = 5

[timeouts]
validate_seconds = 10
plan_seconds = 10
apply_seconds = 30
verify_seconds = 20
rollback_seconds = 30
approval_seconds = 300

[transport]
mode = "https"
bind = "0.0.0.0"
port = 8443

[logging]
level = "INFO"
format = "json"
